name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gasc
          POSTGRES_PASSWORD: gasc_test
          POSTGRES_DB: gasc_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx wasmtime

    - name: Download OPA
      run: |
        mkdir -p bin
        curl -L -o bin/opa https://github.com/open-policy-agent/opa/releases/download/v0.61.0/opa_linux_amd64_static
        chmod +x bin/opa

    - name: Build WASM policy bundle
      run: |
        mkdir -p build
        bin/opa build -t wasm \
          -e 'gasc/governor/admission/result' \
          -e 'gasc/governor/integrity/allow_state_write' \
          -e 'gasc/governor/verification/allow_reintegration' \
          -o build/bundle.tar.gz \
          policies/
        tar xzf build/bundle.tar.gz -C build
        rm -f build/bundle.tar.gz build/data.json build/.manifest
        rm -rf build/policies
        ls -la build/policy.wasm
        echo "Built build/policy.wasm ($(wc -c < build/policy.wasm) bytes)"

    - name: Run Python Tests
      env:
        POSTGRES_TEST_DSN: postgresql://gasc:gasc_test@localhost:5433/gasc_test?sslmode=disable
        OPA_POLICY_BUNDLE: build/policy.wasm
      run: |
        pytest tests/ -m "not slow"

    - name: Run OPA Policy Tests
      run: |
        bin/opa test policies/ -v

    - name: Concurrency benchmark (WASM)
      env:
        OPA_POLICY_BUNDLE: build/policy.wasm
      run: |
        pytest tests/test_concurrency_benchmark.py -v -s -m slow

    - name: Run SQLite Benchmarks
      run: |
        export ARTIFACT_DIR=$(pwd)/
        python -m benchmarks.reproduce_0001b
        cat 0001b_reproduction.md

    - name: Benchmark latency gate
      run: |
        python -c "
        import json, sys
        with open('0001b_reproduction_raw.json') as f:
            data = json.load(f)
        m = data['medians']
        write_ms = m['total_write_ms']
        trav_us = m['traversal_us_per_node']
        print(f'Per-write latency: {write_ms:.3f} ms')
        print(f'Traversal latency: {trav_us:.3f} us/node')
        failed = False
        if write_ms > 15.0:
            print(f'FAIL: per-write latency {write_ms:.3f} ms exceeds 15 ms ceiling')
            failed = True
        if trav_us > 50.0:
            print(f'FAIL: traversal latency {trav_us:.3f} us/node exceeds 50 us ceiling')
            failed = True
        if failed:
            sys.exit(1)
        print('PASS: latency within bounds')
        "

    - name: Score Gateway with GASC-Audit
      run: |
        pip install git+https://github.com/andrebyrd-odingard/gasc-audit.git
        python -m gasc_audit --artifacts . > gasc_audit_report.json
        cat gasc_audit_report.json
        python -c "
        import json, sys
        with open('gasc_audit_report.json') as f:
            report = json.load(f)
        summary = report['conformance_summary']
        if summary['rule_3_compliance_breached']:
            print('FAIL: rule 3 compliance breached')
            sys.exit(1)
        overall = summary['overall_audit_passed']
        if overall:
            print('FAIL: overall_audit_passed flipped to true — rubric may be broken')
            sys.exit(1)
        print('PASS: audit scored as expected (overall_audit_passed: false)')
        "
