name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx

    - name: Download OPA
      run: |
        mkdir -p bin
        curl -L -o bin/opa https://github.com/open-policy-agent/opa/releases/download/v0.61.0/opa_linux_amd64_static
        chmod +x bin/opa

    - name: Run Python Tests
      run: |
        pytest tests/

    - name: Run OPA Policy Tests
      run: |
        bin/opa test policies/ -v

    - name: Run SQLite Benchmarks
      run: |
        export ARTIFACT_DIR=$(pwd)/
        python -m benchmarks.reproduce_0001b
        cat 0001b_reproduction.md

    - name: Score Gateway with GASC-Audit
      run: |
        pip install git+https://github.com/andrebyrd-odingard/gasc-audit.git
        python -c "from gasc_audit_engine import generate_conformance_report; report = generate_conformance_report(); print('\n\n## Conformance Score\n\n' + report)" >> README.md
        cat README.md
