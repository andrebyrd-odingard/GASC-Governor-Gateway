version: '3.8'

services:
  governor_gateway:
    build: .
    ports:
      - "8000:8000"
    # For a secure deployment, the JWT_PUBLIC_KEY must be provided.
    # You can create a .env file in the root directory with:
    # JWT_PUBLIC_KEY="-----BEGIN PUBLIC KEY-----\n..."
    environment:
      - OPA_URL=http://opa:8181
    depends_on:
      - opa

  opa:
    image: openpolicyagent/opa:0.61.0
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    volumes:
      - ./policies:/policies:ro
